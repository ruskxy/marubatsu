<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Neon Marubatsu</title>

<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">

<style>

body{
background:#000;
color:#fff;
font-family:sans-serif;
text-align:center;
margin:0;
padding:20px;
}

h1{
margin:10px 0;
font-weight:600;
letter-spacing:2px;
}

.modeSwitch{
margin:10px auto 20px;
display:flex;
justify-content:center;
gap:10px;
}

.modeSwitch button{
background:#111;
border:1px solid #555;
color:#fff;
padding:8px 14px;
border-radius:6px;
font-size:14px;
}

.modeSwitch button.active{
border-color:#0ff;
box-shadow:0 0 8px #0ff;
}

#board{
width:300px;
margin:0 auto;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
}

.cell{
width:100px;
height:100px;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
background:#111;
border-radius:8px;
}

.o{
color:#0ff;
text-shadow:0 0 12px #0ff;
}

.x{
color:#f0f;
text-shadow:0 0 12px #f0f;
}

.old{
opacity:.4;
animation:blink 1s infinite;
}

@keyframes blink{
0%,100%{opacity:.3}
50%{opacity:1}
}

.win{
background:#033;
box-shadow:0 0 12px #0ff;
}

#status{
margin:15px;
}

button.reset{
margin-top:10px;
padding:8px 16px;
}

</style>
</head>

<body>

<h1>NEON MARUBATSU</h1>

<div class="modeSwitch">
<button id="modeErase" class="active">消える</button>
<button id="modeBomb">爆弾</button>
</div>

<div id="status"></div>

<div id="board"></div>

<button class="reset" onclick="reset()">リセット</button>

<script>

const boardEl=document.getElementById("board")
const statusEl=document.getElementById("status")

let board=[]
let turn="○"
let mode="erase"

let history={"○":[], "×":[]}

let bombIndex=Math.floor(Math.random()*9)

let locked=false
let winningLine=null

const wins=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
]

function init(){
board=new Array(9).fill(null)
turn="○"
history={"○":[], "×":[]}
locked=false
winningLine=null
bombIndex=Math.floor(Math.random()*9)
render()
}

function reset(){
init()
}

document.getElementById("modeErase").onclick=()=>{
mode="erase"
setMode()
}

document.getElementById("modeBomb").onclick=()=>{
mode="bomb"
setMode()
}

function setMode(){

document.getElementById("modeErase").classList.remove("active")
document.getElementById("modeBomb").classList.remove("active")

if(mode==="erase")
document.getElementById("modeErase").classList.add("active")
else
document.getElementById("modeBomb").classList.add("active")

reset()
}

function place(i){

if(locked)return
if(board[i])return

board[i]=turn
history[turn].push(i)

if(mode==="erase"){

if(history[turn].length>3){
let remove=history[turn].shift()
board[remove]=null
}

}

if(mode==="bomb" && i===bombIndex){

explode(i)

}

let win=checkWin()

if(win){

locked=true
winningLine=win
statusEl.textContent=turn+" の勝ち！"
render()
return

}

turn=turn==="○"?"×":"○"

render()
}

function explode(i){

let r=Math.floor(i/3)
let c=i%3

for(let dr=-1;dr<=1;dr++){
for(let dc=-1;dc<=1;dc++){

let nr=r+dr
let nc=c+dc

if(nr>=0&&nr<3&&nc>=0&&nc<3){

let idx=nr*3+nc
board[idx]=null

}

}
}

}

function checkWin(){

for(let w of wins){

let[a,b,c]=w

if(board[a]&&board[a]===board[b]&&board[a]===board[c])
return w

}

return null
}

function render(){

boardEl.innerHTML=""

board.forEach((v,i)=>{

let div=document.createElement("div")
div.className="cell"

if(v){

div.textContent=v

if(v==="○")div.classList.add("o")
if(v==="×")div.classList.add("x")

if(mode==="erase"){

let oldest=history[v][0]

if(v===turn && history[v].length===3 && oldest===i && !locked)
div.classList.add("old")

}

}

if(winningLine && winningLine.includes(i))
div.classList.add("win")

div.onclick=()=>place(i)

boardEl.appendChild(div)

})

statusEl.textContent=locked?statusEl.textContent:"手番: "+turn

}

init()

</script>

</body>
</html>
